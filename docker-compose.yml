services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      REPO_PATH: /srv/repo.git        # 供部署使用的本地裸仓库
      SAMPLES_DIR: /samples/bundles   # 正常样例包（相互依赖）
      SAMPLES_BAD_DIR: /samples/bad   # 反例样例包（缺前置 / 分叉）
    volumes:
      - repo-data:/srv                # 裸仓库持久化
      - ./samples:/samples:ro         # 样例仓库与样例包
    restart: unless-stopped

volumes:
  repo-data:
